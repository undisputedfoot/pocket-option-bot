name: Python tests

on:
  pull_request:
    paths:
      - "pocket-option-bot-main/**"
  push:
    branches: [main]
    paths:
      - "pocket-option-bot-main/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pocket-option-bot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pocket-option-bot-main/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
